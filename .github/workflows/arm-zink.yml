name: Compilar y Empaquetar para macOS (ARM64 nativo con Zink)

on:
  push:
    branches: [ appimage-rebase, master, main ]
  workflow_dispatch:
  pull_request:
    branches: [ appimage-rebase, master, main ]

jobs:
  build-and-package:
    runs-on: macos-latest  # Apple Silicon (ARM64)

    steps:
      - name: Clonar repositorio Trinity
        uses: actions/checkout@v4
        with:
          path: 'trinity'

      - name: Clonar Manifiesto de mcpelauncher
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-manifest'
          ref: 'qt6'
          submodules: 'recursive'
          path: 'mcpelauncher'

      - name: Clonar mcpe-extract (Codeberg)
        run: git clone https://codeberg.org/javiercplus/mcpe-extract.git

      - name: Clonar mcpelauncher-mac-bin (Librerías puente)
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-mac-bin'
          path: 'mac-bin'

      - name: Clonar Mesa (fork con parches Zink/KosmicKrisp)
        uses: actions/checkout@v4
        with:
          repository: 'lucamignatti/mesa'
          path: 'mesa'

      - name: Clonar GLFW (fork con soporte EGL en macOS)
        uses: actions/checkout@v4
        with:
          repository: 'lucamignatti/glfw'
          path: 'glfw'

      - name: Instalar dependencias de compilación (ARM64)
        run: |
          brew update
          brew install cmake ninja qt@6 libzip libpng pkg-config openssl rustup-init
          brew install bison flex llvm glslang spirv-tools molten-vk
          brew link --force qt@6
          rustup-init -y

      - name: Descargar OpenSSL precompilado (ARM64)
        id: openssl
        run: |
          mkdir -p openssl-dir
          curl -L "https://huggingface.co/datasets/ccoffee20/macos/resolve/main/openssl-macos-latest-11.0-arm64.zip" -o openssl.zip
          unzip openssl.zip -d openssl-dir
          # La carpeta dentro del zip suele tener el mismo nombre
          export OPENSSL_ROOT_DIR="$PWD/openssl-dir/openssl-macos-latest-11.0-arm64"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR" >> $GITHUB_ENV

      - name: Compilar Mesa (Zink + KosmicKrisp)
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/bison/bin:$PATH"
          cd mesa

          cat > native.ini << 'EOF'
[binaries]
bison = '/opt/homebrew/opt/bison/bin/bison'
EOF

          meson setup build --native-file native.ini \
            -Dprefix=$PWD/install \
            -Dbuildtype=release \
            -Dplatforms=macos \
            -Degl-native-platform=surfaceless \
            -Degl=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers=kosmickrisp \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dmoltenvk-dir=/opt/homebrew/opt/molten-vk

          ninja -C build
          ninja -C build install

          mkdir -p install/lib/dri
          cd install/lib/dri
          ln -sf ../libgallium-*.dylib zink_dri.so
          ln -sf ../libgallium-*.dylib swrast_dri.so
          cd ../../..

      - name: Compilar GLFW (parcheado)
        run: |
          cd glfw
          mkdir build && cd build
          cmake .. -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=ON -DCMAKE_OSX_ARCHITECTURES=arm64
          make -j$(sysctl -n hw.ncpu)

      - name: Compilar Trinity
        run: |
          cd trinity
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpelauncher (con OpenSSL precompilado)
        run: |
          source $HOME/.cargo/env
          cd mcpelauncher
          mkdir -p build && cd build

          # Opcional: eliminar openssl@3 de brew para evitar conflictos
          # brew uninstall --ignore-dependencies openssl@3 || true

          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DMSA_DAEMON_PATH=. \
            -DENABLE_DEV_PATHS=OFF \
            -DXAL_WEBVIEW_QT_PATH=. \
            -Wno-dev

          ninja
          # Opcional: instalar en un directorio de salida (si se necesita)
          # DESTDIR="$PWD/install" ninja install
          # Pero nosotros copiamos manualmente los ejecutables más adelante

      - name: Compilar mcpe-extract
        run: |
          cd mcpe-extract
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Crear Application Bundle y Empaquetar
        run: |
          mkdir -p dist/Trinity.app/Contents/MacOS
          mkdir -p dist/Trinity.app/Contents/Frameworks/dri
          mkdir -p dist/Trinity.app/Contents/Resources/mcpelauncher
          mkdir -p dist/Trinity.app/Contents/Resources/vulkan/icd.d

          cp mcpelauncher/build/mcpelauncher-client/mcpelauncher-client dist/Trinity.app/Contents/MacOS/
          cp mcpelauncher/build/mcpelauncher-webview/mcpelauncher-webview dist/Trinity.app/Contents/MacOS/
          cp mcpe-extract/build/mcpelauncher-extract dist/Trinity.app/Contents/MacOS/
          cp trinity/build/app/trinity dist/Trinity.app/Contents/MacOS/trinity-bin

          cp -R mac-bin/lib dist/Trinity.app/Contents/Resources/mcpelauncher/

          cp mesa/install/lib/libEGL.dylib dist/Trinity.app/Contents/Frameworks/
          cp mesa/install/lib/libGL.dylib dist/Trinity.app/Contents/Frameworks/
          cp mesa/install/lib/libgallium-*.dylib dist/Trinity.app/Contents/Frameworks/
          cp mesa/install/lib/libvulkan.1.dylib dist/Trinity.app/Contents/Frameworks/
          cp -a mesa/install/lib/dri/*.so dist/Trinity.app/Contents/Frameworks/dri/
          cp mesa/install/share/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json dist/Trinity.app/Contents/Resources/vulkan/icd.d/

          cp glfw/build/src/libglfw.3.dylib dist/Trinity.app/Contents/Frameworks/

          cat << 'EOF' > dist/Trinity.app/Contents/MacOS/trinity
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          APP="$DIR/../.."

          export DYLD_LIBRARY_PATH="$APP/Contents/Frameworks:$DYLD_LIBRARY_PATH"
          export LIBGL_DRIVERS_PATH="$APP/Contents/Frameworks/dri"
          export VK_DRIVER_FILES="$APP/Contents/Resources/vulkan/icd.d/kosmickrisp_mesa_icd.aarch64.json"
          export EGL_PLATFORM=surfaceless
          export MESA_LOADER_DRIVER_OVERRIDE=zink
          export MESA_GL_VERSION_OVERRIDE=4.6
          export MESA_GLSL_VERSION_OVERRIDE=460
          export MESA_VK_IGNORE_CONFORMANCE_WARNING=1
          export MESA_NO_DISK_CACHE=1

          export JAVA_TOOL_OPTIONS="-Dorg.lwjgl.egl.libname=$APP/Contents/Frameworks/libEGL.dylib -Dorg.lwjgl.opengl.libname=$APP/Contents/Frameworks/libGL.dylib -Dorg.lwjgl.glfw.libname=$APP/Contents/Frameworks/libglfw.3.dylib"

          export QT_MAC_WANTS_LAYER=1

          exec "$DIR/trinity-bin" "$@"
          EOF
          chmod +x dist/Trinity.app/Contents/MacOS/trinity

          cat <<EOF > dist/Trinity.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>trinity</string>
              <key>CFBundleIdentifier</key>
              <string>com.trench.trinity.launcher</string>
              <key>CFBundleName</key>
              <string>Trinity</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          if [ -f trinity/resources/branding/com.trench.trinity.launcher.icns ]; then
            cp trinity/resources/branding/com.trench.trinity.launcher.icns dist/Trinity.app/Contents/Resources/AppIcon.icns
          fi

          codesign --force --deep --sign - dist/Trinity.app

          cd dist
          hdiutil create -volname "Trinity Launcher" -srcfolder Trinity.app -ov -format UDZO Trinity.dmg

      - name: Subir instalador DMG
        uses: actions/upload-artifact@v4
        with:
          name: trinity-mcpelauncher-macos-arm64-zink.dmg
          path: dist/Trinity.dmg
          if-no-files-found: error
