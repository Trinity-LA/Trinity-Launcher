name: (Apple Silicon ARM64) Compilar y Empaquetar para macOS

on:
  push:
    branches: [ appimage-rebase, master, main ]
  workflow_dispatch:
  pull_request:
    branches: [ appimage-rebase, master, main ]

jobs:
  build-and-package:
    runs-on: macos-14

    steps:
      - name: Clonar repositorio Trinity
        uses: actions/checkout@v4
        with:
          path: 'trinity'

      - name: Clonar Manifiesto de mcpelauncher
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-manifest'
          ref: 'ng'
          submodules: 'recursive'
          path: 'mcpelauncher'

      - name: Clonar mcpe-extract (Codeberg)
        run: git clone https://codeberg.org/javiercplus/mcpe-extract.git  

      - name: Clonar mcpelauncher-mac-bin (Librerías puente)
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-mac-bin'
          path: 'mac-bin'

      - name: Preparar ANGLE (ARM64)
        run: |
          mkdir -p external_libs/angle_extracted
          curl -L "https://huggingface.co/datasets/ccoffee20/macos/resolve/main/angle-macos-latest-11.0-arm64-tar.zip" -o angle.zip
          unzip angle.zip -d external_libs/angle_extracted
          cd external_libs/angle_extracted
          find . -name "*.tar.xz" -exec tar -xf {} \;

      - name: Instalar Homebrew y dependencias (Nativo ARM64)
        run: |
          brew update
          brew install cmake ninja qt@6 libzip libpng pkg-config openssl@3 rustup-init
          brew link --force qt@6
          rustup-init -y

      - name: Compilar Trinity (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd trinity
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpelauncher (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          source $HOME/.cargo/env
          cd mcpelauncher
          mkdir -p build && cd build
          OPENSSL_DIR="$(brew --prefix openssl@3)"
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -DBUILD_WEBVIEW=OFF \
            -DBUILD_UI=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR" \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpe-extract (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd mcpe-extract
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar launcher nativo (wrapper para trinity-bin)
        run: |
          cat << 'LAUNCHER_EOF' > trinity_launcher.c
          #include <unistd.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include <libgen.h>
          #include <limits.h>
          #include <pwd.h>
          #include <sys/param.h>
          #include <sys/stat.h>
          #include <mach-o/dyld.h>
          
          int main(int argc, char *argv[], char *envp[]) {
              char exe_path[PATH_MAX];
              uint32_t size = sizeof(exe_path);
              if (_NSGetExecutablePath(exe_path, &size) != 0) {
                  return 1;
              }
              char exe_copy[PATH_MAX];
              strncpy(exe_copy, exe_path, sizeof(exe_copy) - 1);
              exe_copy[sizeof(exe_copy) - 1] = '\0';
              char *dir = dirname(exe_copy);
              
              char bin_path[PATH_MAX];
              snprintf(bin_path, sizeof(bin_path), "%s/trinity-bin", dir);
              
              setenv("QT_MAC_WANTS_LAYER", "1", 1);
              setenv("QT_QPA_PLATFORM", "cocoa", 1);
              setenv("SDL_HINT_RENDER_DRIVER", "metal", 1);
              setenv("ANGLE_DEFAULT_PLATFORM", "metal", 1);
              
              char msa_path[PATH_MAX];
              snprintf(msa_path, sizeof(msa_path), "%s/msa-daemon", dir);
              setenv("MSA_DAEMON_PATH", msa_path, 1);
              
              char bundle_root[PATH_MAX];
              snprintf(bundle_root, sizeof(bundle_root), "%s/../../..", dir);
              
              char lib_path[PATH_MAX * 2];
              snprintf(lib_path, sizeof(lib_path), "%s/Frameworks:%s/Resources/mcpelauncher/lib/native/arm64-v8a", 
                       bundle_root, bundle_root);
              const char *existing_dyld = getenv("DYLD_LIBRARY_PATH");
              if (existing_dyld && strlen(existing_dyld) > 0) {
                  char full_path[PATH_MAX * 3];
                  snprintf(full_path, sizeof(full_path), "%s:%s", lib_path, existing_dyld);
                  setenv("DYLD_LIBRARY_PATH", full_path, 1);
              } else {
                  setenv("DYLD_LIBRARY_PATH", lib_path, 1);
              }
              
              const char *existing_fw = getenv("DYLD_FRAMEWORK_PATH");
              char fw_path[PATH_MAX];
              snprintf(fw_path, sizeof(fw_path), "%s/Frameworks", bundle_root);
              if (existing_fw && strlen(existing_fw) > 0) {
                  char full_fw[PATH_MAX * 2];
                  snprintf(full_fw, sizeof(full_fw), "%s:%s", fw_path, existing_fw);
                  setenv("DYLD_FRAMEWORK_PATH", full_fw, 1);
              } else {
                  setenv("DYLD_FRAMEWORK_PATH", fw_path, 1);
              }
              
              struct passwd *pw = getpwuid(getuid());
              if (pw && pw->pw_dir) {
                  char data_dir[PATH_MAX];
                  snprintf(data_dir, sizeof(data_dir), "%s/Library/Application Support/mcpelauncher", pw->pw_dir);
                  mkdir(data_dir, 0755);
                  chdir(data_dir);
              }
              
              char **new_argv = malloc((argc + 1) * sizeof(char *));
              if (!new_argv) return 1;
              new_argv[0] = bin_path;
              for (int i = 1; i < argc; i++) {
                  new_argv[i] = argv[i];
              }
              new_argv[argc] = NULL;
              
              execv(bin_path, new_argv);
              
              perror("execv failed");
              free(new_argv);
              return 1;
          }
          LAUNCHER_EOF
          
          clang -target arm64-apple-macos11.0 \
                -o launcher \
                trinity_launcher.c \
                -framework CoreFoundation \
                -mmacosx-version-min=11.0 \
                -O2 \
                -Wno-deprecated-declarations

      - name: Crear Application Bundle y Empaquetar
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          
          mkdir -p dist/Trinity.app/Contents/MacOS
          mkdir -p dist/Trinity.app/Contents/Frameworks
          mkdir -p dist/Trinity.app/Contents/Resources/mcpelauncher/lib/native/arm64-v8a
          mkdir -p dist/Trinity.app/Contents/Resources/mcpelauncher/lib/arm64-v8a
          mkdir -p dist/lib
          
          cp mcpelauncher/build/mcpelauncher-client/mcpelauncher-client dist/Trinity.app/Contents/MacOS/mcpelauncher-client
          cp mcpe-extract/build/mcpelauncher-extract dist/Trinity.app/Contents/MacOS/
          cp trinity/build/app/trinity dist/Trinity.app/Contents/MacOS/trinity-bin
          
          find mcpelauncher/build -type f -name "msa-daemon" -exec cp {} dist/Trinity.app/Contents/MacOS/ \; || true
          
          cp launcher dist/Trinity.app/Contents/MacOS/trinity
          chmod +x dist/Trinity.app/Contents/MacOS/trinity
          
          ln -s $(brew --prefix qt@6)/lib/QtSvg.framework dist/lib/ || true
          ln -s $(brew --prefix qt@6)/lib/QtVirtualKeyboard.framework dist/lib/ || true
          
          cd dist
          $(brew --prefix qt@6)/bin/macdeployqt Trinity.app \
            -executable=Trinity.app/Contents/MacOS/trinity-bin \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-client \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-extract \
            -executable=Trinity.app/Contents/MacOS/trinity \
            -verbose=2
          cd ..
          
          cp mac-bin/lib/native/arm64-v8a/libfmod*.dylib dist/Trinity.app/Contents/Resources/mcpelauncher/lib/native/arm64-v8a/ 2>/dev/null || true
          cp mac-bin/lib/arm64-v8a/*.so dist/Trinity.app/Contents/Resources/mcpelauncher/lib/arm64-v8a/ 2>/dev/null || true
          
          find external_libs/angle_extracted -name "libEGL.dylib" -exec cp {} dist/Trinity.app/Contents/Frameworks/ \; 2>/dev/null || true
          find external_libs/angle_extracted -name "libGLESv2.dylib" -exec cp {} dist/Trinity.app/Contents/Frameworks/ \; 2>/dev/null || true
          
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/trinity-bin 2>/dev/null || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/mcpelauncher-client 2>/dev/null || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/msa-daemon 2>/dev/null || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/mcpelauncher-extract 2>/dev/null || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/trinity 2>/dev/null || true
          
          cat <<EOF > dist/Trinity.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>trinity-bin</string>
              <key>CFBundleIdentifier</key>
              <string>com.trench.trinity.launcher</string>
              <key>CFBundleName</key>
              <string>Trinity</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
          </dict>
          </plist>
          EOF
          
          cp trinity/resources/branding/com.trench.trinity.launcher.icns dist/Trinity.app/Contents/Resources/AppIcon.icns 2>/dev/null || true
          
          cd dist
          codesign --force --deep --sign - Trinity.app
          
          codesign --force --sign - Trinity.app/Contents/MacOS/trinity
          codesign --force --sign - Trinity.app/Contents/MacOS/trinity-bin
          codesign --force --sign - Trinity.app/Contents/MacOS/mcpelauncher-client
          codesign --force --sign - Trinity.app/Contents/MacOS/mcpelauncher-extract
          
          hdiutil create -volname "Trinity Launcher" -srcfolder Trinity.app -ov -format UDZO Trinity.dmg
          
      - name: Subir instalador DMG
        uses: actions/upload-artifact@v4
        with:
          name: trinity-mcpelauncher-macos-arm64-dmg
          path: dist/Trinity.dmg
          if-no-files-found: error
