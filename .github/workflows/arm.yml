name: (Apple Silicon ARM64) Compilar y Empaquetar para macOS 

on:
  push:
    branches: [ appimage-rebase, master, main ]
  workflow_dispatch:
  pull_request:
    branches: [ appimage-rebase, master, main ]

jobs:
  build-and-package:
    runs-on: macos-14 # Runner nativo M1/ARM64

    steps:
      - name: Clonar repositorio Trinity
        uses: actions/checkout@v4
        with:
          path: 'trinity'

      - name: Clonar Manifiesto de mcpelauncher
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-manifest'
          ref: 'ng' # <-- CAMBIO A LA RAMA NG
          submodules: 'recursive'
          path: 'mcpelauncher'

      - name: Clonar mcpe-extract (Codeberg)
        run: git clone https://codeberg.org/javiercplus/mcpe-extract.git

      - name: Clonar mcpelauncher-mac-bin (Librerías puente)
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-mac-bin'
          path: 'mac-bin'

      - name: Preparar ANGLE (ARM64)
        run: |
          mkdir -p external_libs/angle_extracted
          curl -L "https://huggingface.co/datasets/ccoffee20/macos/resolve/main/angle-macos-latest-11.0-arm64-tar.zip" -o angle.zip
          unzip angle.zip -d external_libs/angle_extracted
          cd external_libs/angle_extracted
          find . -name "*.tar.xz" -exec tar -xf {} \;

      - name: Instalar Homebrew y dependencias (Nativo ARM64)
        run: |
          brew update
          brew install cmake ninja qt@5 libzip libpng pkg-config openssl@3 rustup-init # <-- CAMBIO A QT5
          brew link --force qt@5
          rustup-init -y

      - name: Parchear Trinity para usar Qt5
        run: |
          cd trinity
          # 1. Cambiar todas las referencias de Qt6 a Qt5 en TODOS los CMakeLists.txt
          find . -type f -name "CMakeLists.txt" -exec sed -i '' 's/Qt6/Qt5/g' {} +
          
          # 2. Renombrar la macro de recursos a la versión de Qt5 en TODOS lados
          find . -type f -name "CMakeLists.txt" -exec sed -i '' 's/qt_add_resources/qt5_add_resources/g' {} +
          
          # 3. Eliminar la función qt_standard_project_setup (exclusiva de Qt6) en TODOS lados
          find . -type f -name "CMakeLists.txt" -exec sed -i '' '/qt_standard_project_setup/,/pt_BR)/d' {} +

      - name: Compilar Trinity (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd trinity
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpelauncher (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          source $HOME/.cargo/env
          cd mcpelauncher
          mkdir -p build && cd build
          OPENSSL_DIR="$(brew --prefix openssl@3)"
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR" \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpe-extract (ARM64)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          cd mcpe-extract
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_POLICY_DEFAULT_CMP0169=OLD \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Crear Application Bundle y Empaquetar
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          
          mkdir -p dist/Trinity.app/Contents/MacOS
          mkdir -p dist/Trinity.app/Contents/Frameworks
          mkdir -p dist/Trinity.app/Contents/Resources/mcpelauncher/lib/native/arm64-v8a
          mkdir -p dist/Trinity.app/Contents/Resources/mcpelauncher/lib/arm64-v8a
          mkdir -p dist/lib
          
          # Copiar los binarios recién compilados
          cp mcpelauncher/build/mcpelauncher-client/mcpelauncher-client dist/Trinity.app/Contents/MacOS/mcpelauncher-client
          cp mcpelauncher/build/mcpelauncher-webview/mcpelauncher-webview dist/Trinity.app/Contents/MacOS/
          cp mcpe-extract/build/mcpelauncher-extract dist/Trinity.app/Contents/MacOS/
          cp trinity/build/app/trinity dist/Trinity.app/Contents/MacOS/trinity-bin
          
          # Buscar y copiar el msa-daemon compilado, esté donde esté en la carpeta build
          find mcpelauncher/build -type f -name "msa-daemon" -exec cp {} dist/Trinity.app/Contents/MacOS/ \; || true
          
          # SCRIPT WRAPPER BLINDADO (Rutas absolutas, Gráficos Forzados y Permisos de Escritura para PlayFab)
          cat << 'EOF' > dist/Trinity.app/Contents/MacOS/trinity
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE}" )" && pwd )"
          
          # Aceleración gráfica forzada
          export QT_MAC_WANTS_LAYER=1
          export QT_QPA_PLATFORM=cocoa
          export SDL_HINT_RENDER_DRIVER=metal
          export ANGLE_DEFAULT_PLATFORM=metal
          
          # Rutas absolutas para los demonios de Xbox/Microsoft (evita secuestro de VFS)
          export MSA_DAEMON_PATH="$DIR/msa-daemon"
          export XAL_WEBVIEW_QT_PATH="$DIR/mcpelauncher-webview"
          
          # Inyección de dependencias gráficas y de audio
          export DYLD_LIBRARY_PATH="$DIR/../Frameworks:$DIR/../Resources/mcpelauncher/lib/native/arm64-v8a:$DYLD_LIBRARY_PATH"
          export DYLD_FRAMEWORK_PATH="$DIR/../Frameworks:$DYLD_FRAMEWORK_PATH"
          
          # Salvavidas para SQLite/PlayFab: Mover el directorio de ejecución a una zona de lectura/escritura nativa
          DATA_DIR="$HOME/Library/Application Support/mcpelauncher"
          mkdir -p "$DATA_DIR"
          cd "$DATA_DIR"
          
          exec "$DIR/trinity-bin" "$@"
          EOF
          chmod +x dist/Trinity.app/Contents/MacOS/trinity
          
          # Enlaces simbólicos a Frameworks usando rutas dinámicas de Homebrew para Qt5
          ln -s $(brew --prefix qt@5)/lib/QtSvg.framework dist/lib/ || true
          ln -s $(brew --prefix qt@5)/lib/QtVirtualKeyboard.framework dist/lib/ || true
          
          cd dist
          $(brew --prefix qt@5)/bin/macdeployqt Trinity.app \
            -executable=Trinity.app/Contents/MacOS/trinity-bin \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-client \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-webview \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-extract
          cd ..
          
          # Inyectar dependencias nativas de Android (FMOD y SOs) para ARM64
          cp mac-bin/lib/native/arm64-v8a/libfmod*.dylib dist/Trinity.app/Contents/Resources/mcpelauncher/lib/native/arm64-v8a/
          cp mac-bin/lib/arm64-v8a/*.so dist/Trinity.app/Contents/Resources/mcpelauncher/lib/arm64-v8a/
          
          # Inyectar ANGLE precompilado a Frameworks
          find external_libs/angle_extracted -name "libEGL.dylib" -exec cp {} dist/Trinity.app/Contents/Frameworks/ \;
          find external_libs/angle_extracted -name "libGLESv2.dylib" -exec cp {} dist/Trinity.app/Contents/Frameworks/ \;
          
          # Enseñar a los ejecutables dónde buscar las librerías de ANGLE y dependencias
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/trinity-bin || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/mcpelauncher-client || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/mcpelauncher-webview || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/msa-daemon || true
          install_name_tool -add_rpath @loader_path/../Frameworks dist/Trinity.app/Contents/MacOS/mcpelauncher-extract || true
 
          cat <<EOF > dist/Trinity.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>trinity</string>
              <key>CFBundleIdentifier</key>
              <string>com.trench.trinity.launcher</string>
              <key>CFBundleName</key>
              <string>Trinity</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          cp trinity/resources/branding/com.trench.trinity.launcher.icns dist/Trinity.app/Contents/Resources/AppIcon.icns
          
          cd dist
          codesign --force --deep --sign - Trinity.app
          hdiutil create -volname "Trinity Launcher" -srcfolder Trinity.app -ov -format UDZO Trinity.dmg
          
      - name: Subir instalador DMG
        uses: actions/upload-artifact@v4
        with:
          name: trinity-mcpelauncher-macos-arm64-dmg
          path: dist/Trinity.dmg
          if-no-files-found: error
