name: Compilar y Empaquetar para macOS

on:
  push:
    branches: [ appimage-rebase, master, main ]
  workflow_dispatch:
  pull_request:
    branches: [ appimage-rebase, master, main ]

jobs:
  build-and-package:
    runs-on: macos-latest

    steps:
      - name: Clonar repositorio Trinity
        uses: actions/checkout@v4
        with:
          path: 'trinity'

      - name: Clonar Manifiesto de mcpelauncher
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-manifest'
          ref: 'qt6'
          submodules: 'recursive'
          path: 'mcpelauncher'

      - name: Clonar mcpe-extract (Codeberg)
        run: git clone https://codeberg.org/javiercplus/mcpe-extract.git

      - name: Clonar mcpelauncher-mac-bin (Librerías puente)
        uses: actions/checkout@v4
        with:
          repository: 'minecraft-linux/mcpelauncher-mac-bin'
          path: 'mac-bin'

      - name: Instalar dependencias del sistema (Homebrew)
        run: |
          brew update
          brew install cmake ninja qt@6 libzip libpng pkg-config openssl rustup-init
          brew link --force qt@6
          rustup-init -y

      - name: Compilar Trinity
        run: |
          cd trinity
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpelauncher
        run: |
          source $HOME/.cargo/env
          cd mcpelauncher
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DJNI_USE_JNIVM=ON \
            -DGAMEWINDOW_SYSTEM=SDL3 \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Compilar mcpe-extract
        run: |
          cd mcpe-extract
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -Wno-dev
          cmake --build . --parallel $(sysctl -n hw.ncpu)

      - name: Crear Application Bundle y Empaquetar
        run: |
          mkdir -p dist/Trinity.app/Contents/MacOS
          mkdir -p dist/lib
          
          # 1. Copiar SOLO los binarios ejecutables
          cp trinity/build/app/trinity dist/Trinity.app/Contents/MacOS/
          cp mcpelauncher/build/mcpelauncher-client/mcpelauncher-client dist/Trinity.app/Contents/MacOS/
          cp mcpelauncher/build/mcpelauncher-webview/mcpelauncher-webview dist/Trinity.app/Contents/MacOS/
          cp mcpe-extract/build/mcpelauncher-extract dist/Trinity.app/Contents/MacOS/
          
          # Enlazar los frameworks faltantes de Homebrew
          ln -s /opt/homebrew/opt/qtsvg/lib/QtSvg.framework dist/lib/
          ln -s /opt/homebrew/opt/qtvirtualkeyboard/lib/QtVirtualKeyboard.framework dist/lib/
          ln -s /opt/homebrew/opt/qtvirtualkeyboard/lib/QtVirtualKeyboardQml.framework dist/lib/
          
          cd dist
          
          # 2. Ejecutar macdeployqt PRIMERO (no colapsará porque aún no hay archivos .so)
          $(brew --prefix qt@6)/bin/macdeployqt Trinity.app \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-client \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-webview \
            -executable=Trinity.app/Contents/MacOS/mcpelauncher-extract
          
          cd ..
          
          # 3. LUEGO inyectar las librerías puente (shims) donde el juego las necesita
          cp -R mac-bin/lib dist/Trinity.app/Contents/MacOS/
          
          # 4. Inyectar también las librerías gráficas ANGLE (.dylib) para solucionar el error de OpenGL
          find mcpelauncher/build -name "*.dylib" -exec cp {} dist/Trinity.app/Contents/MacOS/ \;
          
          cd dist
          
          # 5. Firmar la aplicación completa (codesign procesará todo sin importar el formato)
          codesign --force --deep --sign - Trinity.app
          
          # 6. Crear el archivo DMG final
          hdiutil create -volname "Trinity" -srcfolder Trinity.app -ov -format UDZO Trinity.dmg
          
      - name: Subir instalador DMG
        uses: actions/upload-artifact@v4
        with:
          name: trinity-mcpelauncher-macos-dmg
          path: dist/Trinity.dmg
          if-no-files-found: error
