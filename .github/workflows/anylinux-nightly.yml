name: AnyLinux Nightly

# Canal diario. Reemplaza al antiguo "Nightly Compilar y Empaquetar
# AppImage" (nightly.yml), que era un empaquetado linuxdeploy sobre
# Ubuntu, solo x86_64 y sin zsync fiable. Ahora es el mismo pipeline
# AnyLinux del canal Latest, con cron.
#
# Ver anylinux-latest.yml para el empaquetado (squashfs + runtime
# estatico) y las reglas del catalogo que cumple.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

# Un tag, un escritor: evita que un run manual se solape con el cron y
# deje el release a medias.
concurrency:
  group: anylinux-nightly
  cancel-in-progress: false

jobs:
  build:
    name: "Trinity Nightly (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    # Regla anylinux: compilar SOLO en Arch Linux (Fedora/Ubuntu rompen el deploy)
    container: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      PACKAGER: squashfs
      OUTNAME: Trinity_Launcher-${{ matrix.arch }}.AppImage
      CHANNEL: nightly
      GLIBC_TARGET: "2.28"
    steps:
      - name: Instalar dependencias base
        run: pacman -Sy --noconfirm git openssh
      - name: Instalar Zig (toolchain con glibc antigua)
        run: |
          pacman -S --noconfirm zig
          zig version

      - name: Configurar toolchain Zig (glibc antigua + LLVM)
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            TRIPLE="aarch64-linux-gnu"
          else
            TRIPLE="x86_64-linux-gnu"
          fi
          echo "CC=zig cc" >> "$GITHUB_ENV"
          echo "CXX=zig c++" >> "$GITHUB_ENV"
          echo "ZIG_TARGET=${TRIPLE}.${GLIBC_TARGET}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Cache ccache + zig
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .zig-cache
          key: anylinux-nightly-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            anylinux-nightly-${{ matrix.arch }}-

      
      - name: Clonar mcpe-nx
        env:
          SSH_KEY: ${{ secrets.WORDS_B }}
          REPO: ${{ secrets.MCPE_XN }}
        run: |
          set -euo pipefail

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k || true; rm -f word' EXIT

          printf '%s' "$SSH_KEY" | base64 -d > word
          chmod 600 word
          ssh-add word

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H -T 15 gitlab.com 2>/dev/null > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes"

          git clone -b untested "$REPO" mcpe-nx

      - name: Parchear script para respetar zig cc
        run: |
          # Reemplaza los export incondicionales por asignaciones que solo actúan si CC/CXX no están definidos
          sed -i 's/^export CC=clang$/export CC="${CC:-clang}"/' trinity-appimage.sh
          sed -i 's/^export CXX=clang++$/export CXX="${CXX:-clang++}"/' trinity-appimage.sh
          # Verifica que el parche se aplicó (opcional, para depurar)
          grep -n 'export CC' trinity-appimage.sh || true
          grep -n 'export CXX' trinity-appimage.sh || true
          
      - name: Configurar toolchain Zig (glibc 2.28 + LLVM)
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            TRIPLE="aarch64-linux-gnu"
          else
            TRIPLE="x86_64-linux-gnu"
          fi
          echo "CC=zig cc -target ${TRIPLE}.${GLIBC_TARGET}" >> "$GITHUB_ENV"
          echo "CXX=zig c++ -target ${TRIPLE}.${GLIBC_TARGET}" >> "$GITHUB_ENV"
          
      - name: Construir AppImage
        run: |
          export CC="zig cc"
          export CXX="zig c++"
          export CMAKE_C_COMPILER_TARGET="${ZIG_TARGET}"
          export CMAKE_CXX_COMPILER_TARGET="${ZIG_TARGET}"
          sh ./trinity-appimage.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Trinity_Launcher-${{ matrix.arch }}-nightly
          path: dist

  release:
    # Publica lo que haya: si un arch falla, el otro sale igual.
    if: ${{ !cancelled() }}
    needs: [build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trinity_Launcher-*-nightly
          merge-multiple: true

      - name: Subir a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: |
            Trinity_Launcher-*.AppImage
            *.zsync
